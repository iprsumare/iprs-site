# Publica o guia de identidade visual no GitHub Pages: https://iprsumare.github.io/iprs-site/
# Só vão para o site o guia (index.html), os logos e os QR codes. O resto do repositório não é publicado.
name: Publicar guia (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["index.html", "logo/**", "qrcode/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Separar os arquivos do site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r logo qrcode _site/
          rm -rf _site/logo/legado
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
